# Veriterra — déploiement prod (Arcane, GitOps par Git Sync).
# Image pré-construite tirée de GHCR (repo public) ; veriterra / worker / migrate
# partagent la même image avec des `command` différentes.
# Le tag d'image (`:latest` ci-dessous) est réécrit sur le SHA git par .github/workflows/
# release.yml à chaque release : Arcane suit ce dépôt (Git Sync + Auto Sync) et redéploie
# quand le compose change. Ne PAS activer l'auto-update par digest d'Arcane sur ce projet
# (un seul déclencheur). Ne pas éditer le tag à la main, release.yml en est la source.
# Variables via le .env géré par Arcane (Environment Configuration).
#
# Réseaux :
#   - internal : db, redis, veriterra, worker, migrate. Aucun port publié ; la base et
#     Redis ne sont PAS sur le réseau du proxy (séparation db / front).
#   - web : réseau Caddy EXISTANT (externe). Seul `veriterra` y est attaché pour que
#     Caddy l'atteigne en `reverse_proxy veriterra:3000`. Pas de port exposé sur l'hôte.

services:
  db:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage objet (pièces jointes). Sur le réseau INTERNE uniquement : jamais exposé à Caddy
  # ni au navigateur (l'app proxifie upload et download). Aucun port publié. Identifiants via .env.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - internal

  # One-shot : applique les migrations (extension, rôle, RLS, tables) au démarrage.
  migrate:
    image: ghcr.io/lukas-houille/veriterra:19145eb95ce33e069e90a34a64cd23004838d507
    command: pnpm --filter @veriterra/db run deploy
    env_file: .env
    restart: 'no'
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  veriterra:
    image: ghcr.io/lukas-houille/veriterra:19145eb95ce33e069e90a34a64cd23004838d507
    command: pnpm --filter @veriterra/app run start
    env_file: .env
    restart: unless-stopped
    # Sur internal (db/redis) ET sur le réseau Caddy (front). Aucun port publié :
    # Caddy l'atteint via `reverse_proxy veriterra:3000`.
    networks:
      - internal
      - web
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/lukas-houille/veriterra:19145eb95ce33e069e90a34a64cd23004838d507
    command: pnpm --filter @veriterra/worker run start
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'pnpm', '--filter', '@veriterra/worker', 'run', 'healthcheck']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  internal:
    driver: bridge
  web:
    external: true
    # Nom RÉEL de ton réseau Caddy (défaut "caddy"). Override possible via CADDY_NETWORK.
    name: ${CADDY_NETWORK:-caddy}
