# Veriterra — déploiement prod (Arcane).
# Image pré-construite tirée de GHCR (repo public, aucun identifiant requis) ;
# app / worker / migrate partagent la même image avec des `command` différentes.
# Les variables viennent du fichier .env géré par Arcane (Environment Configuration).
# Les services app et worker portent le label updater pour l'auto-update Arcane.

services:
  db:
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot : applique les migrations (extension, rôle, RLS, tables) au démarrage.
  migrate:
    image: ghcr.io/lukas-houille/veriterra:latest
    command: pnpm --filter @veriterra/db run deploy
    env_file: .env
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/lukas-houille/veriterra:latest
    command: pnpm --filter @veriterra/app start
    env_file: .env
    restart: unless-stopped
    labels:
      com.getarcaneapp.arcane.updater: 'true'
    # Exposé seulement sur la loopback de l'hôte : Caddy (sur l'hôte) fait le reverse
    # proxy + TLS. Si Caddy tourne en conteneur, mets-le sur ce réseau et vise `app:3000`.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/lukas-houille/veriterra:latest
    command: pnpm --filter @veriterra/worker start
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      com.getarcaneapp.arcane.updater: 'true'
    healthcheck:
      test: ['CMD', 'pnpm', '--filter', '@veriterra/worker', 'healthcheck']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
